<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pertanyaan &amp; Jawaban Debat Karhutla</title>
<link rel="icon" href="__FISH__">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@500;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#FFF4E3;--pill:#FFE0B0;--ink:#1d1710;--mut:#7a6a54}
body{margin:0;min-height:100vh;font:500 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#f6d79b 1.3px,transparent 1.6px) 0 0/16px 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #1c7ed6;outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:30px 20px 50px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
h1{font:700 clamp(30px,6vw,56px)/1.05 Fredoka,sans-serif;margin:0}
h1 span{display:block;color:#D9480F}
.sub{margin:10px 0 0;color:var(--mut);font-size:14px}
.bw{flex:none;text-align:center;font-size:11px;color:var(--mut)}
.bulb{width:62px;height:62px;border-radius:50%;border:2.5px solid var(--ink);background:#FFD43B;font-size:28px;box-shadow:3px 3px 0 var(--ink);animation:pl 2.4s infinite;transition:.15s}
.bulb:hover{transform:rotate(-8deg) scale(1.07)}
@keyframes pl{50%{box-shadow:3px 3px 0 var(--ink),0 0 0 10px #ffd43b66}}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{border:2px solid var(--ink);background:#ffffffaa;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
button.chip{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:#e0a100}.dot.on{background:#2f9e44}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.card{text-align:left;background:var(--pill);border:2.5px solid var(--ink);border-radius:22px;padding:18px;box-shadow:5px 5px 0 var(--ink);transition:.15s;display:flex;flex-direction:column;gap:10px;min-height:138px}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.ic{width:46px;height:46px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;background:var(--c)}
.card b{font:700 19px/1.15 Fredoka,sans-serif}
.cnt{margin-top:auto;font-size:12.5px;color:#5b4a33;font-weight:700}
.mod{grid-column:2;background:#FFD27A;animation:gl 3s infinite}
@keyframes gl{50%{box-shadow:5px 5px 0 var(--ink),0 0 38px 10px #ffb30077}}
footer{position:relative;background:#BBD9F8;overflow:hidden;color:#16263d}
.wave{position:absolute;left:0;top:80px;width:100%;height:130px}
.fi{position:relative;max-width:1040px;margin:0 auto;padding:0 20px 26px;display:grid;grid-template-columns:1fr 200px 1fr;align-items:center;gap:16px}
.sw{position:relative;height:250px}
.shield{height:100%;background:#2a2b2e;clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:64px}
.fn{font:400 44px/1 'Bebas Neue',sans-serif;letter-spacing:2px;color:#bdbdbd}
.fish{position:absolute;left:50%;top:62px;width:270px;max-width:none;animation:sw 4s ease-in-out infinite;pointer-events:none}
@keyframes sw{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px) rotate(-2deg)}}
.fl{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:700;background:none;border:0;color:inherit;text-decoration:none;transition:.15s}
.fl:hover{transform:translateY(-3px)}
.fb,.cv{width:64px;height:64px;display:grid;place-items:center}
.fb{border-radius:18px;background:var(--ink)}
.cv{border-radius:50%;background:linear-gradient(135deg,#00c4cc,#7d2ae8);color:#fff;font:italic 700 16px Fredoka,sans-serif}
.cap{grid-column:1/-1;text-align:center;margin:6px 0 0;font-size:13px}
.ov{position:fixed;inset:0;background:#1d171099;display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.sh{background:var(--bg);border:2.5px solid var(--ink);border-radius:26px 26px 0 0;width:min(620px,100%);max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shh{position:sticky;top:0;z-index:1;background:var(--pill);border-bottom:2.5px solid var(--ink);padding:14px 18px;display:flex;align-items:center;gap:12px;font:700 20px Fredoka,sans-serif}
.shh span{flex:1}
.x{width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:#fff}
#sb{padding:16px 18px 22px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#ffffffaa;font-weight:700}
.tab.on,.ch button.on{background:var(--ink);color:var(--bg)}
.it{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pill);border:1.5px solid var(--ink);margin-bottom:6px}
.it p{margin:0;white-space:pre-wrap;word-break:break-word}
.ac{display:flex;gap:14px;margin-top:8px}
.ac button{border:0;background:none;font-size:12.5px;font-weight:700;color:var(--mut);padding:0;text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:14px 0}
textarea,input{width:100%;font:inherit;border:2px solid var(--ink);border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink);resize:vertical}
.lb{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch button{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700}
.btn{border:2.5px solid var(--ink);background:#FFD43B;border-radius:14px;padding:11px 18px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.g{background:#fff}
.row{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.add{width:100%;border:2.5px dashed var(--ink);background:none;border-radius:16px;padding:12px;font-weight:700;font-size:16px}
.add:hover{background:var(--pill)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-size:14px;font-weight:700}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:26px;box-shadow:8px 8px 0 var(--ink)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}.mod{grid-column:1/-1}.card{padding:14px;min-height:122px}.card b{font-size:16px}.bulb{width:52px;height:52px;font-size:24px}.fi{grid-template-columns:1fr 1fr}.sw{grid-column:1/-1;justify-self:center;width:200px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="w">
<header>
 <div><h1>Pertanyaan &amp; Jawaban <span>Debat Karhutla</span></h1><p class="sub">Kelompok 1 · ketuk peran untuk menulis pertanyaan atau jawaban</p></div>
 <div class="bw"><button class="bulb" id="bulb" aria-label="Kirim ide">💡</button><div>Punya ide?</div></div>
</header>
<div class="bar">
 <span class="chip"><span class="dot" id="dt"></span><span id="md">Menghubungkan...</span></span>
 <span class="chip">❓ <span id="nq">0</span> pertanyaan</span>
 <span class="chip">💬 <span id="na">0</span> jawaban</span>
 <button class="chip" id="rk">📋 Rekap</button>
</div>
<main class="grid" id="g"></main>
</div>
<footer>
<svg class="wave" viewBox="0 0 1200 130" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50C200 0 360 90 600 50S1000 10 1200 60V130H0Z" fill="#3b78b5"/><path d="M0 80C240 40 420 110 650 80S1000 40 1200 90V130H0Z" fill="#1b3f78" opacity=".85"/></svg>
<div class="fi">
 <button class="fl" id="bug"><span class="fb"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ff8a1f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 8h8v7a4 4 0 0 1-8 0zM9 8a3 3 0 0 1 6 0M4 12h4M16 12h4M5 6l3 2M19 6l-3 2M5 19l3-2M19 19l-3-2"/></svg></span>Laporkan bug</button>
 <div class="sw"><div class="shield"><div class="fn">FRISCH</div></div><img class="fish" src="__FISH__" alt="Logo Frisch"></div>
 <a class="fl" href="https://canva.link/2ihjg0yxuq098ql" target="_blank" rel="noopener"><span class="cv">Canva</span>Buka template debat</a>
 <p class="cap">Frisch adalah pembuat website khusus untuk tugas debat pipas kelompok 1 tentang karhutla.</p>
</div>
</footer>
<div class="ov" id="ov" hidden><div class="sh" role="dialog" aria-modal="true" aria-labelledby="st"><div class="shh"><span id="st"></span><button class="x" id="sx" aria-label="Tutup">✕</button></div><div id="sb"></div></div></div>
<div class="toast" id="ts" hidden></div>

<script type="module">
const WA='6285336310953',LS='karhutla_v1';
const cfg={apiKey:"AIzaSyAVET98aBIEYJyivXAxt77th3TiqAAIx9M",authDomain:"debat-karhutla-tugas-pipas.firebaseapp.com",projectId:"debat-karhutla-tugas-pipas",storageBucket:"debat-karhutla-tugas-pipas.firebasestorage.app",messagingSenderId:"619916566067",appId:"1:619916566067:web:963d5415331b33a5a5cd46",measurementId:"G-2SD27NEEHQ"};
const R=[
{id:'ma',n:'Masyarakat terdampak',e:'🏘️',c:'#FFB4A2'},
{id:'pe',n:'Petani pembuka lahan',e:'🌾',c:'#C7E3A0'},
{id:'pr',n:'Perusahaan perkebunan',e:'🏭',c:'#E8D3B0'},
{id:'go',n:'Pemerintah',e:'🏛️',c:'#B8D4F5'},
{id:'hk',n:'Penegak hukum',e:'⚖️',c:'#D5C6F0'},
{id:'ak',n:'Aktivis lingkungan',e:'🌿',c:'#A8E0CF'},
{id:'mo',n:'Moderator',e:'🎙️',c:'#FFF3C4',mod:1}];
const $=s=>document.querySelector(s),rn=id=>R.find(r=>r.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],live=false,fs,db,cur=null,tab='q',edit=null,adding=false,tgt='',fk='',rt='',tt;
const loadL=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch{return[]}};
const cache=()=>{try{localStorage.setItem(LS,JSON.stringify(items))}catch{}};
items=loadL();

function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function mode(on){live=on;$('#dt').className='dot'+(on?' on':'');$('#md').textContent=on?'Tersinkron realtime':'Mode lokal (tidak dibagi)'}
function home(){
 $('#g').innerHTML=R.map(r=>{const q=items.filter(i=>i.role===r.id&&i.type==='q').length,a=items.filter(i=>i.role===r.id&&i.type==='a').length,m=items.filter(i=>i.role===r.id).length;
 return `<button class="card${r.mod?' mod':''}" data-id="${r.id}" style="--c:${r.c}"><span class="ic">${r.e}</span><b>${r.n}</b><span class="cnt">${r.mod?m+' catatan':q+' pertanyaan · '+a+' jawaban'}</span></button>`}).join('');
 $('#nq').textContent=items.filter(i=>i.type==='q').length;$('#na').textContent=items.filter(i=>i.type==='a').length}
function sheet(t,h){$('#st').innerHTML=t;$('#sb').innerHTML=h;$('#ov').hidden=false}
function close(){$('#ov').hidden=true;cur=null;adding=false;edit=null}
function composer(ty){const e=edit&&items.find(i=>i.id===edit);
 let h='<div class="it" style="background:#FFF8E8">';
 if(ty==='q')h+=`<span class="lb" style="margin-top:0">Ditujukan ke</span><div class="ch">${R.filter(r=>!r.mod&&r.id!==cur).map(r=>`<button data-g="${r.id}" class="${r.id===tgt?'on':''}">${r.e} ${r.n}</button>`).join('')}</div>`;
 return h+`<label class="lb" for="tx">${ty==='q'?'Pertanyaan':ty==='a'?'Jawaban':'Teks moderator'}</label><textarea id="tx" rows="4" placeholder="Tulis di sini...">${e?esc(e.text):''}</textarea><div class="row"><button class="btn g" id="cn">Batal</button><button class="btn" id="sv">Simpan</button></div></div>`}
function panel(){
 const r=rn(cur),ty=r.mod?'m':tab,list=items.filter(i=>i.role===cur&&i.type===ty),lab=r.mod?'catatan':ty==='q'?'pertanyaan':'jawaban';
 let h=r.mod?'':`<div class="tabs"><button class="tab${ty==='q'?' on':''}" data-t="q">❓ Pertanyaan</button><button class="tab${ty==='a'?' on':''}" data-t="a">💬 Jawaban</button></div>`;
 h+=list.map(i=>{const t=i.target&&rn(i.target);return `<div class="it">${t?`<span class="tg">→ ${t.e} ${t.n}</span>`:''}<p>${esc(i.text)}</p><div class="ac"><button data-e="${i.id}">Ubah</button><button data-d="${i.id}">Hapus</button></div></div>`}).join('')||(adding?'':`<div class="empty">Belum ada ${lab}. Ketuk + untuk menambah.</div>`);
 h+=adding?composer(ty):`<button class="add" id="add">+ Tambah ${lab}</button>`;
 sheet(`${r.e} ${r.n}`,h)}
function refresh(){home();if(cur&&!adding)panel()}
function loc(d,id){if(id){const i=items.find(x=>x.id===id);if(i)Object.assign(i,d)}else items.push({...d,id:'l'+Date.now(),ts:Date.now()});cache();home()}
function put(d,id){
 if(live){const p=id?fs.updateDoc(fs.doc(db,'debat',id),d):fs.addDoc(fs.collection(db,'debat'),{...d,ts:Date.now()});p.catch(()=>{mode(false);loc(d,id)});return}
 loc(d,id)}
function del(id){
 const l=()=>{items=items.filter(i=>i.id!==id);cache();refresh()};
 if(live)fs.deleteDoc(fs.doc(db,'debat',id)).catch(()=>{mode(false);l()});else l()}
function rekap(){
 rt=R.map(r=>{const l=items.filter(i=>i.role===r.id);return l.length?r.n.toUpperCase()+'\n'+l.map(i=>(i.type==='q'?'Tanya'+(i.target?' ke '+rn(i.target).n:''):i.type==='a'?'Jawab':'Moderator')+': '+i.text).join('\n'):''}).filter(Boolean).join('\n\n');
 sheet('📋 Rekap debat',`<div class="it"><p>${esc(rt)||'Belum ada isi.'}</p></div><div class="row"><button class="btn" id="cp">Salin semua</button></div>`)}
const F={ide:{t:'💡 Saya punya ide',l:'Bagaimana jika:',p:'Tulis idemu...',f:x=>`Saya punya ide 💡\nBagaimana jika: ${x}`},
 bug:{t:'🐞 Laporkan bug',l:'Apa yang bermasalah?',p:'Ceritakan bug yang kamu temui...',f:x=>`🐞 Laporan bug - Debat Karhutla\n${x}\n\nPerangkat: ${navigator.userAgent}`}};
function form(k){fk=k;const o=F[k];cur=null;sheet(o.t,`<label class="lb" style="margin-top:0" for="nm">Namamu (opsional)</label><input id="nm" placeholder="Contoh: Rina"><label class="lb" for="fx">${o.l}</label><textarea id="fx" rows="5" placeholder="${o.p}"></textarea><div class="row"><button class="btn" id="kr">Kirim lewat WhatsApp</button></div>`);$('#fx').focus()}

$('#g').onclick=e=>{const b=e.target.closest('.card');if(!b)return;cur=b.dataset.id;tab='q';edit=null;tgt='';adding=!!rn(cur).mod;panel();if(adding)$('#tx').focus()};
$('#sb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){tab=d.t;adding=false;edit=null;panel()}
 else if(b.id==='add'){adding=true;edit=null;tgt='';panel();$('#tx').focus()}
 else if(d.g){tgt=d.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b))}
 else if(d.e){edit=d.e;tgt=items.find(i=>i.id===edit).target||'';adding=true;panel();$('#tx').focus()}
 else if(d.d){if(confirm('Hapus item ini?'))del(d.d)}
 else if(b.id==='cn'){adding=false;edit=null;panel()}
 else if(b.id==='sv'){const text=$('#tx').value.trim(),ty=rn(cur).mod?'m':tab;
  if(!text)return toast('Teksnya masih kosong');
  if(ty==='q'&&!tgt)return toast('Pilih target pertanyaan dulu');
  put({role:cur,type:ty,target:ty==='q'?tgt:'',text},edit);adding=false;edit=null;panel();toast('Tersimpan')}
 else if(b.id==='cp'){navigator.clipboard.writeText(rt).then(()=>toast('Tersalin'),()=>toast('Gagal menyalin'))}
 else if(b.id==='kr'){const x=$('#fx').value.trim(),n=$('#nm').value.trim();if(!x)return toast('Isi dulu pesannya');
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(F[fk].f(x)+(n?'\n- '+n:'')),'_blank')}};
$('#bulb').onclick=()=>form('ide');$('#bug').onclick=()=>form('bug');$('#rk').onclick=()=>{cur=null;rekap()};
$('#sx').onclick=close;$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
mode(false);$('#md').textContent='Menghubungkan...';home();

(async()=>{try{
 const A=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),F2=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');
 const app=A.initializeApp(cfg);db=F2.getFirestore(app);fs=F2;
 import('https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js').then(m=>m.getAnalytics(app)).catch(()=>{});
 F2.onSnapshot(F2.collection(db,'debat'),s=>{mode(true);items=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));refresh()},()=>{mode(false);items=loadL();refresh()});
}catch(e){mode(false)}})();
</script>
</body></html>
