<style>
*{box-sizing:border-box}
:root{--bg:#FFF4E3;--pill:#FFE0B0;--ink:#1d1710;--mut:#7a6a54}
body{margin:0;min-height:100vh;font:500 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#f6d79b 1.3px,transparent 1.6px) 0 0/16px 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #1c7ed6;outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:30px 20px 50px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
h1{font:700 clamp(30px,6vw,56px)/1.05 Fredoka,sans-serif;margin:0}
h1 span{display:block;color:#D9480F}
.sub{margin:10px 0 0;color:var(--mut);font-size:14px}
.bw{flex:none;text-align:center;font-size:11px;color:var(--mut)}
.bulb{width:62px;height:62px;border-radius:50%;border:2.5px solid var(--ink);background:#FFD43B;font-size:28px;box-shadow:3px 3px 0 var(--ink);animation:pl 2.4s infinite;transition:.15s}
.bulb:hover{transform:rotate(-8deg) scale(1.07)}
@keyframes pl{50%{box-shadow:3px 3px 0 var(--ink),0 0 0 10px #ffd43b66}}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{border:2px solid var(--ink);background:#ffffffaa;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
button.chip{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;background:#e0a100}.dot.on{background:#2f9e44}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.card{text-align:left;background:var(--pill);border:2.5px solid var(--ink);border-radius:22px;padding:18px;box-shadow:5px 5px 0 var(--ink);transition:.15s;display:flex;flex-direction:column;gap:10px;min-height:138px}
.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.ic{width:46px;height:46px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;background:var(--c)}
.card b{font:700 19px/1.15 Fredoka,sans-serif}
.cnt{margin-top:auto;font-size:12.5px;color:#5b4a33;font-weight:700}
.mod{grid-column:2;background:#FFD27A;animation:gl 3s infinite}
@keyframes gl{50%{box-shadow:5px 5px 0 var(--ink),0 0 38px 10px #ffb30077}}
footer{position:relative;background:#BBD9F8;overflow:hidden;color:#16263d}
.wave{position:absolute;left:0;top:100px;width:100%;height:130px}
.fi{position:relative;max-width:1040px;margin:0 auto;padding:0 20px 26px;display:grid;grid-template-columns:1fr 230px 1fr;align-items:center;gap:16px}
.sw{position:relative;height:290px;width:230px}
.shield{height:100%;background:#2a2b2e;clip-path:polygon(0 0,100% 0,100% 74%,50% 100%,0 74%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:68px}
.fn{font:400 44px/1 'Bebas Neue',sans-serif;letter-spacing:2px;color:#bdbdbd}
.fish{position:absolute;left:50%;top:26px;width:250px;max-width:none;animation:sw 4s ease-in-out infinite;pointer-events:none}
@keyframes sw{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
.fl{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:700;background:none;border:0;color:inherit;text-decoration:none;transition:.15s}
.fl:hover{transform:translateY(-3px)}
.fb,.cv{width:64px;height:64px;display:grid;place-items:center}
.fb{border-radius:18px;background:var(--ink)}
.cv{border-radius:50%;background:linear-gradient(135deg,#00c4cc,#7d2ae8);color:#fff;font:italic 700 16px Fredoka,sans-serif}
.cap{grid-column:1/-1;text-align:center;margin:6px 0 0;font-size:13px}
.ov{position:fixed;inset:0;background:#1d171099;display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.sh{background:var(--bg);border:2.5px solid var(--ink);border-radius:26px 26px 0 0;width:min(620px,100%);max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shh{position:sticky;top:0;z-index:1;background:var(--pill);border-bottom:2.5px solid var(--ink);padding:14px 18px;display:flex;align-items:center;gap:12px;font:700 20px Fredoka,sans-serif}
.shh span{flex:1}
.x{width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:#fff}
#sb{padding:16px 18px 22px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#ffffffaa;font-weight:700}
.tab.on,.ch button.on{background:var(--ink);color:var(--bg)}
.it{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pill);border:1.5px solid var(--ink);margin-bottom:6px}
.it p{margin:0;white-space:pre-wrap;word-break:break-word}
.ac{display:flex;gap:14px;margin-top:8px}
.ac button{border:0;background:none;font-size:12.5px;font-weight:700;color:var(--mut);padding:0;text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:14px 0}
textarea,input{width:100%;font:inherit;border:2px solid var(--ink);border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink);resize:vertical}
.lb{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch button{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700}
.btn{border:2.5px solid var(--ink);background:#FFD43B;border-radius:14px;padding:11px 18px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.g{background:#fff}
.row{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.add{width:100%;border:2.5px dashed var(--ink);background:none;border-radius:16px;padding:12px;font-weight:700;font-size:16px}
.add:hover{background:var(--pill)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-size:14px;font-weight:700}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:26px;box-shadow:8px 8px 0 var(--ink)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}.mod{grid-column:1/-1}.card{padding:14px;min-height:122px}.card b{font-size:16px}.bulb{width:52px;height:52px;font-size:24px}.fi{grid-template-columns:1fr 1fr;row-gap:22px}.sw{grid-column:1/-1;order:-1;justify-self:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
